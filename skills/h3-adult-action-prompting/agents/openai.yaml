interface:
  display_name: "H3 成人动作提示词 / Adult Action Prompting"
  short_description: "原始 prompting-guide 检索 + 中英文 H3 动作转译 + Ref2VA/T2VA/I2VA 结构化输出"
  default_prompt: "Use $h3-adult-action-prompting with a source-first workflow. Retrieve the closest terminology and prompt-construction patterns from the original prompting guide when available, otherwise use the normalized bilingual dictionaries. Then translate the requested adult fictional/synthetic action into precise MiniMax H3 motion language: position, active subject, direction, cadence, amplitude, full motion cycle, synchronized body response, stabilizers, face-priority camera framing, continuity, and the correct T2VA/I2VA/Ref2VA structure. If the user writes Chinese, consult the Chinese guide and return Chinese when requested."

policy:
  allow_implicit_invocation: true

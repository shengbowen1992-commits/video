  default_prompt: "Use $h3-tailchain-continuity to write story_segments.json with six-section Ref2VA prompts: fixed female Picture 1 and male Picture 2; segment 1 contains no Picture 3; segment 2 onward uses the immediately preceding accepted tail-lineart as Picture 3 for opening geometry and visible action phase only. Carry relevant mutable non-geometric state in concise prompt text for every persistent subject and prop, preserve completed one-time transitions without replay, and put requested visible/vocal reactions inside each affected Shot."


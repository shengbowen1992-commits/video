name: Build bilingual prompting guide

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-prompting-guide-bilingual.yml"

permissions:
  contents: read

concurrency:
  group: prompting-guide-bilingual-v3
  cancel-in-progress: true

jobs:
  stopped:
    runs-on: ubuntu-latest
    steps:
      - run: echo "GitHub translation workflow stopped. No translation work is running."

name: Build bilingual prompting guide

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-prompting-guide-bilingual.yml"
      - "skills/h3-adult-action-prompting/scripts/build_bilingual_prompting_guide.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install translator
        run: python -m pip install --upgrade deep-translator

      - name: Build English and Chinese source corpora
        run: python skills/h3-adult-action-prompting/scripts/build_bilingual_prompting_guide.py

      - name: Commit generated corpora
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/h3-adult-action-prompting/references/prompting-guide.source.en.json
          git add skills/h3-adult-action-prompting/references/prompting-guide.source.zh-CN.json
          git add skills/h3-adult-action-prompting/references/prompting-guide.translation-meta.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Add bilingual prompting guide source corpus"
            git push
          fi
